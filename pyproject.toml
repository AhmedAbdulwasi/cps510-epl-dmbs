[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cps510-epl-dbms"
version = "0.1.0"
description = "Tkinter interface for the CPS510 English Premier League database"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["oracledb>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
