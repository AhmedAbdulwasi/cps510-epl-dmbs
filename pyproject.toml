[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cps510-epl-dbms"
version = "0.1.0"
description = "Streamlit interface"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "oracledb>=2.0",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "streamlit>=1.32",
]

[tool.setuptools.packages.find]
where = ["src"]
